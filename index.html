  // Catch anything that goes wrong (script load failures, JS errors, unhandled
  // promise rejections) and show it directly on the page instead of a blank
  // screen, so we can actually see what broke.
  function showError(msg) {
    var box = document.getElementById("error-box");
    if (box) {
      box.style.display = "block";
      box.textContent = "Something went wrong loading the page:\n\n" + msg;
    }
    var loading = document.getElementById("fallback-loading");
    if (loading) loading.remove();
  }
  window.addEventListener("error", function (e) {
    showError((e.message || "Unknown error") + "\n" + (e.filename ? e.filename + ":" + e.lineno : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    showError("Unhandled promise rejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
