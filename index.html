<style>
  /* ---- Minimal reset (replaces Tailwind Preflight) ---- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #root { min-height: 100%; margin: 0; padding: 0; }
  h1, h2, h3, p { margin: 0; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; margin: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  a { color: inherit; }

  /* Custom class (not a Tailwind name) so nothing can override this height fix.
     100dvh tracks the real visible mobile screen, unlike 100vh. */
  .pe-fullheight { min-height: 100vh; min-height: 100dvh; }
  body { font-family: 'Work Sans', sans-serif; }
  .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
  .headline { font-family: 'Sora', sans-serif; font-weight: 700; letter-spacing: -0.01em; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .floor-texture {
    background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 42px);
  }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes moreBelowBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
  .more-below-bounce { animation: moreBelowBounce 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .more-below-bounce { animation: none; } }
  .anim-in { animation: fadeSlideIn 0.38s ease both; }
  @media (prefers-reduced-motion: reduce) { .anim-in { animation: none; } }
  .opt-btn { transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease; }
  .opt-btn:active { transform: scale(0.98); }

  /* Guaranteed text sizing — static CSS, not runtime-generated, so text stays
     readable no matter what. */
  /* Prevent iOS Safari from auto-boosting/shrinking text size based on its
     own column-width heuristics — guarantees the font sizes below render
     exactly as specified, matching preview every time. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  html { font-size: 19px; }
  .text-xs { font-size: 0.88rem; line-height: 1.25rem; }
  .text-sm { font-size: 1.02rem; line-height: 1.5rem; }
  .text-\[15px\] { font-size: 1.1rem; line-height: 1.65rem; }
  .text-base { font-size: 1.15rem; line-height: 1.75rem; }
  .text-lg { font-size: 1.3rem; line-height: 1.85rem; }
  .text-xl { font-size: 1.5rem; line-height: 2rem; }
  .text-2xl { font-size: 1.85rem; line-height: 2.25rem; }
  .text-4xl { font-size: 2.65rem; line-height: 2.75rem; }
  .text-6xl { font-size: 3.9rem; line-height: 1; }

  /* ---- Static replacements for every layout/utility class used below ----
     Baked in at build time instead of generated live by a CDN script, so
     rendering can never depend on a network request finishing in time. */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .block { display: block; }
  .flex { display: flex; }
  .inline-flex { display: inline-flex; }
  .flex-1 { flex: 1 1 0%; }
  .flex-col { flex-direction: column; }
  .items-center { align-items: center; }
  .items-start { align-items: flex-start; }
  .justify-between { justify-content: space-between; }
  .justify-center { justify-content: center; }
